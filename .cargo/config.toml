[alias]
xtask   = "run --package xtask --release --"
gen-sys = "run --package xtask --release -- regen-sys"
# Check + clippy everything from root: watch crates on the app target, host
# crates on the host. bacon runs per-crate now (see bacon.toml), so `check-sys`
# / `clippy-sys` below are largely superseded.
ci      = "run --package xtask --release -- ci"

# On-watch crates need the app target; the workspace default stays host for
# xtask/cargo-gneiss/gneiss-build. Run from the workspace root: the --target
# path is resolved against cwd.
check-sys  = ["check",  "-p", "gneiss-sys", "--features", "emery", "--target", "crates/cargo-gneiss/thumbv7m-pebble.json", "-Zbuild-std=core", "-Zjson-target-spec"]
clippy-sys = ["clippy", "-p", "gneiss-sys", "--features", "emery", "--target", "crates/cargo-gneiss/thumbv7m-pebble.json", "-Zbuild-std=core", "-Zjson-target-spec"]
doc-sys    = ["doc",    "-p", "gneiss-sys", "-p", "gneiss-types", "-p", "gneiss", "--features", "gneiss/emery", "--target", "crates/cargo-gneiss/thumbv7m-pebble.json", "-Zbuild-std=core,alloc", "-Zjson-target-spec"]
# Compiles (doesn't run) gneiss's doc examples on the app target
doc-test   = ["test", "--doc", "-p", "gneiss", "--features", "gneiss/emery,gneiss/__doctest", "--target", "crates/cargo-gneiss/thumbv7m-pebble.json", "-Zbuild-std=core,alloc", "-Zjson-target-spec"]
