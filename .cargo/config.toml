[alias]
xtask   = "run --package xtask --release --"
gen-sys = "run --package xtask --release -- regen-sys"

# On-watch crates need the app target; the workspace default stays host for
# xtask/cargo-pebble/pebble-build. Run from the workspace root: the --target
# path is resolved against cwd.
check-sys  = ["check",  "-p", "pebble-sys", "--features", "emery", "--target", "crates/cargo-pebble/thumbv7m-pebble.json", "-Zbuild-std=core", "-Zjson-target-spec"]
clippy-sys = ["clippy", "-p", "pebble-sys", "--features", "emery", "--target", "crates/cargo-pebble/thumbv7m-pebble.json", "-Zbuild-std=core", "-Zjson-target-spec"]
