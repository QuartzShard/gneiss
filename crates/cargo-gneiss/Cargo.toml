[package]
name              = "cargo-gneiss"
version           = "0.1.3"
description       = "Create, build and install gneiss Pebble apps"
rust-version      = "1.98"
keywords          = ["pebble", "pebbleos", "cargo"]
categories        = ["development-tools::cargo-plugins", "embedded"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "cargo-gneiss"
path = "src/main.rs"

[dependencies]
gneiss-types = { workspace = true, features = ["manifest_types"] }
gneiss-build = { workspace = true }
unix-time = { workspace = true, default-features = true }
clap       = { workspace = true }
color-eyre = { workspace = true }
zip        = "0.6"
serde      = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
toml = "1.1.2"
uuid = { workspace = true, features = ["std", "v4", "serde"] }
syn.workspace = true
prettyplease = { workspace = true }
cargo_metadata = { workspace = true }
toml_edit = { version = "0.25.12", features = ["serde"] }
proc-macro2.workspace = true
serde_json = { workspace = true }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ctrlc = "3.5.2"
bzip2 = "0.4"
bytemuck = { workspace = true }
ureq = "3.4.2"
tar = "0.4.46"
sha2 = "0.10"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper"] }
