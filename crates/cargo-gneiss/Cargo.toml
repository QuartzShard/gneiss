[package]
name              = "cargo-gneiss"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "cargo-gneiss"
path = "src/main.rs"

[dependencies]
pebble-types = { workspace = true, features = ["manifest_types"] }
pebble-build = { workspace = true }
unix-time = { workspace = true, default-features = true }
clap       = { workspace = true }
color-eyre = { workspace = true }
zip        = "0.6"
serde      = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
toml = "1.1.2"
uuid = { workspace = true, features = ["std", "v4", "serde"] }
syn.workspace = true
prettyplease = { workspace = true }
cargo_metadata = { workspace = true }
toml_edit = { version = "0.25.12", features = ["serde"] }
proc-macro2.workspace = true
serde_json = { workspace = true }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ctrlc = "3.5.2"
