[package]
name              = "gneiss"
version           = "0.4.0"
description       = "Safe Rust SDK for Pebble watchapps and watchfaces"
keywords          = ["pebble", "pebbleos", "smartwatch", "watchface"]
categories        = ["embedded", "no-std"]
readme            = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Points at the watch target spec in a sibling crate, which doesn't ship
exclude = ["/.cargo"]

[package.metadata.docs.rs]
# Watch crates document as emery, on the built-in target with the same ABI
features = ["emery", "user-panic-handler"]
targets  = ["thumbv7m-none-eabi"]

[lints]
workspace = true

[lib]

[dependencies]
gneiss-sys    = { workspace = true }
gneiss-macros = { workspace = true }
linkme        = { workspace = true }
bytemuck      = { workspace = true, features = ["derive", "min_const_generics"] }
bitflags = "2.13.2"
embedded-graphics-core = "0.4"

[build-dependencies]
gneiss-types = { workspace = true, features = ["std"] }

[features]
default    = ["debug-logs"]
# Without it, `debug!`/`verbose!` (including gneiss's own) compile to nothing
debug-logs = []
# Log every window's load, appear, disappear, unload, handle drop and destroy, for tests
trace-ui   = []
# The app brings its own #[panic_handler], and needn't build with -Cpanic=immediate-abort
user-panic-handler = []
# Platform selection forwards to gneiss-sys, where the mutually-exclusive check
# lives. An app enables exactly one; `gneiss::sys` then resolves for that board.
emery   = ["gneiss-sys/emery"]
flint   = ["gneiss-sys/flint"]
gabbro  = ["gneiss-sys/gabbro"]
aplite  = ["gneiss-sys/aplite"]
basalt  = ["gneiss-sys/basalt"]
chalk   = ["gneiss-sys/chalk"]
diorite = ["gneiss-sys/diorite"]
# Only for `cargo test --doc`: an allocator for the examples to link against
__doctest = []
