[package]
name              = "gneiss-types"
version           = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description       = "Shared types across the gneiss-sys / cargo-gneiss / xtask crates"

[lints]
workspace = true

[lib]

[features]
std   = []
manifest_types = ["std", "serde"]

clap  = ["dep:clap", "std"]
serde = ["dep:serde", "std", "unix-time/serde", "uuid/serde"]

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
clap  = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
strum = { workspace = true }
unix-time = { workspace=true, optional = true }
uuid = { workspace = true, optional = true }
