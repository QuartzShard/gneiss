[package]
name              = "cargo-pebble"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-pebble"
path = "src/main.rs"

[dependencies]
pebble-types = { workspace = true, features = ["manifest_types"] }
pebble-build = { workspace = true }
unix-time = { workspace = true, default-features = true }
clap       = { version = "4", features = ["derive"] }
color-eyre = "0.6"
zip        = "0.6"
serde      = { version = "1", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.10"
toml = "1.1.2"
uuid = { version = "1", features = ["v4", "serde"] }
syn.workspace = true
prettyplease = "0.2.37"
cargo_metadata = "0.23.1"
toml_edit = { version = "0.25.12", features = ["serde"] }
proc-macro2.workspace = true
