[package]
name = "gneiss-build"
version = "0.5.0"
description = "Build-time resource compiling and bundling for gneiss apps"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gneiss-types = { workspace = true, features = ["manifest_types"] }
bytemuck = { workspace = true }
unix-time = { workspace = true, default-features = true }
color-eyre = { workspace = true }
object = "0.32"
rustc-demangle = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, features = ["std", "serde"] }
cargo_metadata = { workspace = true }
image = "0.25.10"
png = "0.18.1"
strum = { workspace = true }
freetype-rs = { version = "0.38.0", features = ["bundled"] }
regex = "1.12.4"
roxmltree = "0.21.1"
svgtypes = "0.16.1"
quote.workspace = true
proc-macro2.workspace = true
syn.workspace = true
prettyplease.workspace = true

