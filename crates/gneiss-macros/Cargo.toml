[package]
name              = "gneiss-macros"
version           = "0.5.0"
description       = "Macros for gneiss, an SDK for pebble watches"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn         = { workspace = true, features = ["full"] }
quote       = { workspace = true }
proc-macro2 = { workspace = true }
darling = "0.24.1"
# Exact: rust-analyzer republishes rustc's parser weekly, as a new 0.x each time
ra-ap-rustc_parse_format = "=0.177.0"
# Exact: the parser's lexer fails to build unless unicode-ident and unicode-properties share a
# Unicode version, and unicode-ident 1.0.27 moved ahead of unicode-properties 0.1.4
unicode-ident = "=1.0.24"

[dev-dependencies]
prettyplease = { workspace = true }
