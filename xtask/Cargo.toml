[package]
name              = "xtask"
version           = "0.0.0"
edition.workspace = true
publish           = false

[dependencies]
bindgen      = "0.69"
pebble-types = { workspace = true, features = ["clap"] }
syn          = { workspace = true }
quote        = { workspace = true }
proc-macro2  = { workspace = true }
serde_json   = "1"
color-eyre   = "0.6"
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
prettyplease = "0.2.37"
log = "0.4.29"
env_logger = "0.11.10"
itertools = "0.14.0"
strum = "0.28.0"
