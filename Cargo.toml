[workspace]
resolver = "3"
members = [
    "crates/pebble-types",
    "crates/pebble-sys",
    "crates/gneiss",
    "crates/gneiss-macros",
    "crates/cargo-gneiss",
    "crates/pebble-build",
	"xtask",
]
exclude = ["examples"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MPL-2.0"
repository = "https://codeberg.org/quartzshard/gneiss"

[workspace.dependencies]
# Internal
pebble-types  = { path = "crates/pebble-types",  version = "0.1.0" }
pebble-build  = { path = "crates/pebble-build",  version = "0.1.0" }
pebble-sys    = { path = "crates/pebble-sys",    version = "0.1.0" }
gneiss-macros = { path = "crates/gneiss-macros", version = "0.1.0" }

# External — single source of truth so versions don't drift across crates
bytemuck	  = { version = "1.25.0" }
linkme        = { version = "0.3", default-features = false }
syn           = { version = "3", features = ["full", "extra-traits"] }
quote         = "1"
proc-macro2   = "1"
unix-time	  = { version = "0.1.5", default-features = false }
strum         = { version = "0.28.0", default-features = false, features = ["derive"] }
cargo_metadata = "0.23.1"
clap           = { version = "4", features = ["derive"] }
color-eyre     = "0.6"
env_logger     = "0.11.10"
log            = "0.4.29"
prettyplease   = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
uuid           = { version = "1", default-features = false }

# release/dev are left at Cargo defaults — every workspace member builds for
# the host (xtask, cargo-gneiss, and library unit tests). Firmware artifacts
# select `fw` explicitly via `--profile fw`.
[profile.fw]
inherits        = "release"
opt-level       = "z"
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = "symbols"
overflow-checks = false

# Pedantic across the board. The no-panic set is *not* here: a host-side build
# tool aborting with a message is a fine failure mode, so it lives as crate-root
# attributes in the crates that ship to the watch (gneiss, pebble-sys,
# pebble-types). `unwrap_used` is the exception — a bare unwrap gives no message
# anywhere, so it's denied everywhere; `expect` is the host-side escape hatch.
[workspace.lints.clippy]
pedantic    = { level = "warn", priority = -1 }
unwrap_used = "deny"

struct_excessive_bools   = "allow"
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_possible_wrap       = "allow"
cast_sign_loss           = "allow"
missing_errors_doc       = "allow"
type_complexity          = "allow"
too_many_lines           = "allow"
must_use_candidate		 = "allow"

# TODO: Remove this when eyre stops tripping it
[workspace.lints.rust]
semicolon_in_expressions_from_non_local_macros = "allow"
