[package]
name = "sys-only"
# authors[0] used as the watch-menu "company"
authors = ["quartzshard"]
version = "0.1.0"
edition = "2024"

[package.metadata.pebble]
uuid = "ab4b7ba2-c41b-4aa5-9e4b-b93d81d2d948"
watchface = false
# No resources. The table must still be present, just empty.
resources = {}

[dependencies.gneiss-sys]
path = "../../crates/gneiss-sys"
features = []

[build-dependencies.gneiss-build]
path = "../../crates/gneiss-build"
features = []

[features]
# Default platform, so a bare `cargo check` (rust-analyzer) builds + runs codegen.
default = ["emery"]
emery = ["gneiss-sys/emery"]
basalt = ["gneiss-sys/basalt"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
overflow-checks = false
trim-paths = "all"
