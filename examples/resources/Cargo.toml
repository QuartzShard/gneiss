[package]
name = "resources"
# authors[0] used as the watch-menu "company"
authors = ["quartzshard"]
version = "0.1.0"
edition = "2024"

[package.metadata.pebble]
uuid = "bfccfe59-e1a6-4b31-848c-697a5becda85"
watchface = false

# Every resource entry needs `file`, `target_platforms`, and `type`. The name of
# the table (e.g. APP_ICON) becomes a `resources::APP_ICON: u32` const in the app.
#
# Siblings of `file` named `<stem>~<tag>.<ext>` override it on the platforms
# carrying those tags (the platform name, `color`/`bw`, `rect`/`round`, `200w`,
# `touch`, ...); a name match wins, then the most tags, then `file` itself.
# Built for emery, flint, chalk, basalt and aplite, which between them cover
# colour and black and white, round and rect, and both SDK vintages.

# The menu icon: a special-case bitmap, at most one per app, wired into the app
# header automatically. You do not normally load it from code.
[package.metadata.pebble.resources.APP_ICON]
type = "icon"
file = "icon.png"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# Arbitrary bytes, copied verbatim. Read back at runtime with resource_load.
# flint matches both data~flint.bin and data~bw.bin and takes the name; aplite
# takes data~bw.bin; the colour watches fall back to data.bin. The app draws
# whichever one it was given as its title.
[package.metadata.pebble.resources.DATA_RAW]
type = "raw"
file = "data.bin"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# Any `image`-supported file -> an indexed PNG the firmware decodes on load.
# Both built platforms have a variant (image~emery.png / image~flint.png), each
# drawn for that watch's screen size and colour depth; image.png is what any
# other platform would get.
[package.metadata.pebble.resources.IMAGE_PNG]
type = "png"
file = "image.png"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# Any `image`-supported file -> a .pbi (raw pebble bitmap, no runtime decode).
# Points at logo.png, which has no siblings, so every platform compiles that
# one file for itself.
[package.metadata.pebble.resources.IMAGE_BITMAP]
type = "bitmap"
file = "logo.png"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# An already-baked .pbi, copied verbatim (only validated). Loads like a bitmap.
# A .pbi is quantised for a colour depth rather than for a watch, so the
# siblings are tagged `color` and `bw` rather than per platform: logo~color.pbi
# is 2-bit palettised, logo~bw.pbi is 1-bit. There is no shared logo.pbi, so a
# platform matching neither would fail the build.
[package.metadata.pebble.resources.IMAGE_PBI]
type = "pbi"
file = "logo.pbi"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# A freetype-rasterised font -> .pbf. FontSettings (camelCase) tune it:
#   pixelHeight, characterRegex / characterList, compress, extended, trackingAdjust
[package.metadata.pebble.resources.FONT_ROBOTO_18]
type = "font"
file = "font.ttf"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]
pixelHeight = 18
characterRegex = "[ -~]"
compress = true

# An already-baked .pbf, copied verbatim (only validated). Loads like a font.
[package.metadata.pebble.resources.FONT_PBF]
type = "pbf"
file = "font.pbf"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# SVGs compiled to Pebble Draw Commands: vectors the firmware strokes and fills
# at draw time rather than a bitmap. A single file becomes a .pdc image, a
# directory of frames (sorted by filename, all sharing one viewBox) an animated
# .pdc sequence. SvgSettings (camelCase) tune both: precise, tolerance,
# frameDurationMs, playCount.
[package.metadata.pebble.resources.FERRIS_PDC]
type = "svg"
file = "ferris.svg"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

# Curves are subdivided to `tolerance` pixels, which is what a vector costs you
# in bytes: 0.5px halves this spinner against the default. A 0xFFFF play count
# is the firmware's "loop forever", so the app can feed it a monotonic clock.
[package.metadata.pebble.resources.SPINNER_PDCS]
type = "svg"
file = "spinner"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]
tolerance = 0.5
frameDurationMs = 60
playCount = 65535

# A vibration score compiled from a JSON pattern (see buzz.json).
[package.metadata.pebble.resources.BUZZ]
type = "vibe"
file = "buzz.json"
target_platforms = ["emery", "flint", "chalk", "basalt", "aplite"]

[dependencies.gneiss]
path = "../../crates/gneiss"
features = []

[build-dependencies.pebble-build]
path = "../../crates/pebble-build"
features = []

[features]
# Default platform, so a bare `cargo check` (rust-analyzer) builds + runs codegen.
default = ["emery"]
emery = ["gneiss/emery"]
flint = ["gneiss/flint"]
chalk = ["gneiss/chalk"]
basalt = ["gneiss/basalt"]
aplite = ["gneiss/aplite"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
overflow-checks = false
