[package]
name = "window_nav"
# authors[0] used as the watch-menu "company"
authors = ["quartzshard"]
version = "0.1.0"
edition = "2024"

[package.metadata.pebble]
uuid = "25261b4f-4732-4984-a242-e97e4f24ff96"
watchface = false
# This demo exercises windows, not resources; the table must
# still be present, just empty.
resources = {}

[dependencies.gneiss]
path = "../../crates/gneiss"

[build-dependencies.gneiss-build]
path = "../../crates/gneiss-build"
features = []

[features]
default = ["emery"]
emery = ["gneiss/emery"]
flint = ["gneiss/flint"]
chalk = ["gneiss/chalk"]
gabbro = ["gneiss/gabbro"]
basalt = ["gneiss/basalt"]
diorite = ["gneiss/diorite"]
aplite = ["gneiss/aplite"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
overflow-checks = false
trim-paths = "all"
