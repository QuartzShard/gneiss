[package]
name = "navigation"
# authors[0] used as the watch-menu "company"
authors = ["quartzshard"]
version = "0.1.0"
edition = "2024"

[package.metadata.pebble]
uuid = "205e0e7d-c5c4-4c4f-86fe-5881e1b3041d"
watchface = false
# This demo exercises windows and navigation, not resources; the table must
# still be present, just empty.
resources = {}

[dependencies.gneiss]
path = "../../crates/gneiss"

[build-dependencies.gneiss-build]
path = "../../crates/gneiss-build"
features = []

[features]
default = ["emery"]
emery = ["gneiss/emery"]
flint = ["gneiss/flint"]
chalk = ["gneiss/chalk"]
basalt = ["gneiss/basalt"]
aplite = ["gneiss/aplite"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
overflow-checks = false
trim-paths = "all"
