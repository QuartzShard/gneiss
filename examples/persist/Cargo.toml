[package]
name = "persist"
# authors[0] used as the watch-menu "company"
authors = ["quartzshard"]
version = "0.1.0"
edition = "2024"

[package.metadata.pebble]
uuid = "7f0ef20a-75bd-4b21-bafe-79ec668606fa"
watchface = false
# No resources, but the table must still be present.
resources = {}

[dependencies.gneiss]
path = "../../crates/gneiss"

[build-dependencies.gneiss-build]
path = "../../crates/gneiss-build"
features = []

[features]
# Default platform, so a bare `cargo check` (rust-analyzer) builds + runs codegen.
default = ["emery"]
emery = ["gneiss/emery"]
basalt = ["gneiss/basalt"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
overflow-checks = false
trim-paths = "all"
