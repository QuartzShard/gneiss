[package]
name = "stopwatch"
# authors[0] used as the watch-menu "company"
authors = ["quartzshard"]
version = "0.1.0"
edition = "2024"

[package.metadata.pebble]
uuid = "851ee71f-c26d-45e1-bea9-94b2beddfb90"
watchface = false

# The action bar's icons: white on transparent, which the bar draws over its black background
[package.metadata.pebble.resources.ICON_PLAY]
type = "png"
file = "play.png"
target_platforms = ["emery", "basalt"]

[package.metadata.pebble.resources.ICON_PAUSE]
type = "png"
file = "pause.png"
target_platforms = ["emery", "basalt"]

[package.metadata.pebble.resources.ICON_RESET]
type = "png"
file = "reset.png"
target_platforms = ["emery", "basalt"]

[dependencies.gneiss]
path = "../../crates/gneiss"

[build-dependencies.gneiss-build]
path = "../../crates/gneiss-build"
features = []

[features]
# Default platform, so a bare `cargo check` (rust-analyzer) builds + runs codegen.
default = ["emery"]
emery = ["gneiss/emery"]
basalt = ["gneiss/basalt"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
overflow-checks = false
trim-paths = "all"
